<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutorial – Plataforma Un Café para la Sostenibilidad</title>
<style>
  /* ── Variables de color ── */
  :root {
    --crema:      #f5efe6;
    --crema-osc:  #ede3d4;
    --cafe:       #5c3d1e;
    --cafe-med:   #7d5230;
    --cafe-claro: #b07d4a;
    --verde:      #3a6b3a;
    --verde-med:  #4e8c4e;
    --verde-claro:#a8d5a2;
    --verde-tip:  #eaf5e6;
    --texto:      #2b1e0e;
    --blanco:     #fffdf8;
    --sombra:     rgba(92,61,30,.18);
  }


  /* ── Logos footer ── */
  .logos-footer {
    background: #fff;
    padding: 1rem;
    text-align: center;
    border-top: 2px solid var(--crema-osc);
    margin-top: 1rem;
    border-radius: 0 0 12px 12px;
  }
  .logos-footer p {
    font-size: .72rem;
    color: var(--cafe-med);
    margin-bottom: .5rem;
    font-style: italic;
  }
  .logos-img {
    max-width: 100%;
    width: 560px;
    height: auto;
    object-fit: contain;
  }
  .croppie-img {
    max-width: 220px;
    height: auto;
    margin: .5rem auto 0;
    display: block;
  }

  /* ── Reset y base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--crema);
    color: var(--texto);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Fondo decorativo con textura ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(160,100,40,.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(58,107,58,.09) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, var(--cafe) 0%, var(--cafe-med) 60%, var(--verde) 100%);
    color: var(--blanco);
    padding: .9rem 1.2rem;
    position: relative;
    box-shadow: 0 4px 18px var(--sombra);
    z-index: 10;
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .8rem;
    max-width: 640px;
    margin: 0 auto;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: .6rem;
    flex: 1;
  }
  .header-left span.icon { font-size: 1.8rem; flex-shrink: 0; }
  .header h1 {
    font-size: .95rem;
    font-weight: 700;
    letter-spacing: .01em;
    line-height: 1.25;
  }
  .header p {
    font-size: .72rem;
    opacity: .82;
    font-style: italic;
    margin-top: .1rem;
  }
  .header-logos-img {
    height: 48px;
    width: auto;
    max-width: 180px;
    object-fit: contain;
    flex-shrink: 0;
    background: #ffffff;
    border-radius: 8px;
    padding: 4px 6px;
  }
  @media (max-width: 400px) {
    .header-logos-img { height: 36px; max-width: 130px; }
    .header h1 { font-size: .85rem; }
  }

  /* ── Barra de progreso general ── */
  .progress-bar-wrap {
    background: var(--crema-osc);
    height: 6px;
    position: sticky;
    top: 0;
    z-index: 99;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--verde-med), var(--cafe-claro));
    transition: width .5s ease;
  }

  /* ── Contenedor principal ── */
  .main {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 1.5rem 1rem 6rem;
  }

  /* ── Indicador de módulo y paso ── */
  .meta-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  .module-badge {
    background: var(--cafe);
    color: var(--blanco);
    font-size: .72rem;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    padding: .28rem .75rem;
    border-radius: 20px;
    letter-spacing: .04em;
    display: flex; align-items: center; gap: .4rem;
  }
  .step-counter {
    font-size: .78rem;
    color: var(--cafe-med);
    font-family: 'Courier New', monospace;
    background: var(--blanco);
    padding: .28rem .75rem;
    border-radius: 20px;
    border: 1.5px solid var(--crema-osc);
  }

  /* ── Tarjeta de paso ── */
  .step-card {
    background: var(--blanco);
    border-radius: 18px;
    box-shadow: 0 6px 32px var(--sombra);
    overflow: hidden;
    animation: slideIn .4s cubic-bezier(.22,.61,.36,1) both;
    border: 1.5px solid var(--crema-osc);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(28px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .step-card.exit {
    animation: slideOut .3s ease forwards;
  }
  @keyframes slideOut {
    to { opacity: 0; transform: translateY(-20px) scale(.97); }
  }

  /* Banner de módulo arriba de la tarjeta */
  .card-banner {
    padding: 1rem 1.4rem .8rem;
    display: flex;
    align-items: center;
    gap: .8rem;
    border-bottom: 2px solid var(--crema-osc);
  }
  .card-banner-icon {
    font-size: 2.2rem;
    line-height: 1;
    filter: drop-shadow(0 2px 4px var(--sombra));
  }
  .card-banner-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--cafe);
    line-height: 1.25;
  }
  .card-banner-sub {
    font-size: .8rem;
    color: var(--cafe-med);
    font-style: italic;
    margin-top: .15rem;
  }

  /* Cuerpo de la tarjeta */
  .card-body {
    padding: 1.2rem 1.4rem;
  }

  /* Acción principal */
  .action-block {
    margin-bottom: 1rem;
  }
  .action-label {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--cafe-med);
    font-family: 'Courier New', monospace;
    margin-bottom: .4rem;
  }
  .action-text {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--texto);
  }
  .action-text strong {
    color: var(--cafe);
    background: linear-gradient(120deg, rgba(176,125,74,.15) 0%, transparent 100%);
    padding: 0 .15em;
    border-radius: 3px;
  }

  /* Por qué importa */
  .why-block {
    background: var(--crema);
    border-left: 3.5px solid var(--cafe-claro);
    border-radius: 0 10px 10px 0;
    padding: .7rem 1rem;
    margin-bottom: 1rem;
    font-size: .88rem;
    line-height: 1.55;
    color: var(--cafe);
  }
  .why-block::before {
    content: '🌱  ';
    font-size: 1em;
  }

  /* Tip verde */
  .tip-block {
    background: var(--verde-tip);
    border: 1.5px solid var(--verde-claro);
    border-radius: 12px;
    padding: .75rem 1rem;
    font-size: .88rem;
    line-height: 1.55;
    color: var(--verde);
    display: flex;
    gap: .6rem;
    align-items: flex-start;
  }
  .tip-block .tip-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: .05rem; }
  .tip-block strong { color: var(--verde); display: block; margin-bottom: .15rem; font-size: .82rem; text-transform: uppercase; letter-spacing: .07em; }

  /* Pantalla simulada */
  .screen-sim {
    background: #1a1a2e;
    border-radius: 14px;
    padding: 1rem;
    margin: 1rem 0;
    font-family: 'Courier New', monospace;
    font-size: .82rem;
    color: #c8e6c9;
    border: 2px solid #333;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.4);
    position: relative;
    overflow: hidden;
  }
  .screen-sim::before {
    content: '● ● ●';
    display: block;
    color: #666;
    font-size: .7rem;
    margin-bottom: .6rem;
    letter-spacing: .3em;
  }
  .screen-sim .url {
    color: #80cbc4;
    word-break: break-all;
  }
  .screen-sim .field {
    background: rgba(255,255,255,.08);
    border: 1px solid #555;
    border-radius: 6px;
    padding: .4rem .6rem;
    margin: .4rem 0;
    color: #e0e0e0;
    display: block;
  }
  .screen-sim .btn-sim {
    display: inline-block;
    background: var(--verde);
    color: white;
    border-radius: 8px;
    padding: .4rem 1.2rem;
    margin-top: .5rem;
    font-size: .8rem;
    font-weight: bold;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(58,107,58,.6); }
    50%       { box-shadow: 0 0 0 8px rgba(58,107,58,0); }
  }
  .screen-sim .menu-item {
    border-bottom: 1px solid #333;
    padding: .5rem 0;
    color: #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .screen-sim .menu-item:last-child { border: none; }
  .screen-sim .menu-item.active { color: #a5d6a7; font-weight: bold; }
  .screen-sim .badge {
    font-size: .65rem;
    background: #4e8c4e;
    color: white;
    border-radius: 4px;
    padding: .1rem .4rem;
  }
  .screen-sim .badge.warn {
    background: #f57c00;
  }

  /* Pasos numerados dentro de una tarjeta */
  .mini-steps { margin: .8rem 0; }
  .mini-step {
    display: flex;
    gap: .8rem;
    align-items: flex-start;
    padding: .55rem 0;
    border-bottom: 1px dashed var(--crema-osc);
    font-size: .9rem;
    line-height: 1.5;
  }
  .mini-step:last-child { border: none; }
  .mini-step .num {
    background: var(--cafe);
    color: white;
    width: 1.6rem; height: 1.6rem;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: .72rem;
    font-weight: 700;
    font-family: 'Courier New', monospace;
    margin-top: .1rem;
  }
  .mini-step.done .num { background: var(--verde-med); }

  /* ── Navegación inferior ── */
  .nav-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--blanco);
    border-top: 2px solid var(--crema-osc);
    padding: .9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    box-shadow: 0 -4px 20px var(--sombra);
    z-index: 100;
    max-width: 640px;
    margin: 0 auto;
    left: 50%;
    transform: translateX(-50%);
  }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-family: Georgia, serif;
    font-size: .92rem;
    font-weight: 700;
    border: none;
    border-radius: 50px;
    padding: .65rem 1.3rem;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, opacity .2s;
    letter-spacing: .02em;
  }
  .nav-btn:active { transform: scale(.96); }
  .btn-prev {
    background: var(--crema-osc);
    color: var(--cafe);
  }
  .btn-prev:hover { background: #ddd0be; }
  .btn-next {
    background: linear-gradient(135deg, var(--verde-med), var(--cafe));
    color: white;
    box-shadow: 0 4px 14px rgba(58,107,58,.35);
  }
  .btn-next:hover { box-shadow: 0 6px 20px rgba(58,107,58,.45); transform: translateY(-1px); }
  .btn-next:disabled, .btn-prev:disabled {
    opacity: .35;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }
  .nav-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .2rem;
    flex: 1;
  }
  .dots-row {
    display: flex; gap: .35rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--crema-osc);
    transition: background .3s, transform .3s;
  }
  .dot.done  { background: var(--verde-claro); }
  .dot.active{ background: var(--cafe); transform: scale(1.4); }
  .nav-label {
    font-size: .7rem;
    color: var(--cafe-med);
    font-family: 'Courier New', monospace;
  }

  /* ── Pantalla de bienvenida ── */
  .welcome-card {
    text-align: center;
    padding: 2rem 1.5rem;
  }
  .welcome-card .big-icon { font-size: 4rem; display: block; margin-bottom: 1rem;
    animation: floatIcon 3s ease-in-out infinite;
  }
  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-8px); }
  }
  .welcome-card h2 {
    font-size: 1.4rem;
    color: var(--cafe);
    margin-bottom: .6rem;
    line-height: 1.3;
  }
  .welcome-card p {
    font-size: .95rem;
    line-height: 1.65;
    color: var(--cafe-med);
    margin-bottom: 1.2rem;
  }
  .modulos-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .6rem;
    text-align: left;
    margin: 1rem 0;
  }
  .mod-item {
    background: var(--crema);
    border: 1.5px solid var(--crema-osc);
    border-radius: 10px;
    padding: .6rem .8rem;
    font-size: .82rem;
    display: flex; gap: .5rem; align-items: center;
    color: var(--cafe);
    font-weight: 600;
  }

  /* ── Pantalla final ── */
  .final-card { text-align: center; padding: 2rem 1.5rem; }
  .final-card .big-icon { font-size: 4rem; display: block; margin-bottom: 1rem; }
  .final-card h2 { font-size: 1.4rem; color: var(--verde); margin-bottom: .7rem; }
  .final-card p  { font-size: .95rem; line-height: 1.65; color: var(--cafe-med); margin-bottom: .8rem; }
  .url-box {
    background: var(--verde-tip);
    border: 1.5px solid var(--verde-claro);
    border-radius: 10px;
    padding: .8rem 1rem;
    font-family: 'Courier New', monospace;
    font-size: .78rem;
    color: var(--verde);
    word-break: break-all;
    margin: 1rem 0;
  }
  .summary-list {
    list-style: none;
    text-align: left;
    margin: 1rem 0;
  }
  .summary-list li {
    padding: .45rem 0;
    border-bottom: 1px dashed var(--crema-osc);
    display: flex; gap: .6rem; align-items: center;
    font-size: .9rem;
  }
  .summary-list li:last-child { border: none; }

  /* ── Responsive ── */
  @media (max-width: 400px) {
    .header h1 { font-size: 1rem; }
    .card-banner-title { font-size: .95rem; }
    .action-text { font-size: .92rem; }
    .modulos-grid { grid-template-columns: 1fr; }
    .nav-btn { font-size: .82rem; padding: .6rem 1rem; }
  }
</style>
</head>

// ─────────────────────────────────────────────
//  ESTADO Y LÓGICA DE NAVEGACIÓN
// ─────────────────────────────────────────────
let current = 0;
const TOTAL = steps.length;

function renderStep(idx, direction) {
  const main    = document.getElementById('mainContent');
  const pb      = document.getElementById('progressBar');
  const prev    = document.getElementById('btnPrev');
  const next    = document.getElementById('btnNext');
  const dots    = document.getElementById('dotsRow');
  const label   = document.getElementById('navLabel');

  // Progreso
  const pct = Math.round((idx / (TOTAL - 1)) * 100);
  pb.style.width = pct + '%';

  // Etiqueta
  label.textContent = `Paso ${idx + 1} de ${TOTAL}`;

  // Botones
  prev.disabled = (idx === 0);
  next.disabled = (idx === TOTAL - 1);
  next.textContent = idx === TOTAL - 2 ? 'Ver resumen →' : (idx === TOTAL - 1 ? '—' : 'Siguiente →');

  // Dots
  dots.innerHTML = '';
  steps.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i < idx ? ' done' : '') + (i === idx ? ' active' : '');
    dots.appendChild(d);
  });

  // Contenido
  const s = steps[idx];
  let metaHTML = '';
  if (s.module) {
    metaHTML = `
      <div class="meta-bar">
        <div class="module-badge">${s.module.icon} ${s.module.title}</div>
        <div class="step-counter">Paso ${idx + 1} / ${TOTAL}</div>
      </div>
    `;
  }

  // Slide out old
  const old = main.querySelector('.step-card');
  if (old) {
    old.style.animation = direction > 0
      ? 'slideOut .25s ease forwards'
      : 'slideOutBack .25s ease forwards';
  }

  setTimeout(() => {
    if (s.module) {
      main.innerHTML = metaHTML + `<div class="step-card" style="animation: slideIn .4s cubic-bezier(.22,.61,.36,1) both;">${s.render()}</div>`;
    } else {
      main.innerHTML = `<div style="animation: slideIn .4s cubic-bezier(.22,.61,.36,1) both;">${s.render()}</div>`;
    }
    main.scrollTop = 0;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, old ? 220 : 0);
}

// Añadir keyframes dinámicos para slide-back
const styleExtra = document.createElement('style');
styleExtra.textContent = `
  @keyframes slideOutBack {
    to { opacity: 0; transform: translateY(20px) scale(.97); }
  }
`;
document.head.appendChild(styleExtra);

function navigate(dir) {
  const next = current + dir;
  if (next < 0 || next >= TOTAL) return;
  current = next;
  renderStep(current, dir);
}

// Swipe táctil
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60) navigate(dx < 0 ? 1 : -1);
}, { passive: true });

// Teclado
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   navigate(-1);
});

// Inicio
renderStep(0, 1);
</script>
